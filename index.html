<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارگاه مینا سرا</title>
<style id="msrStyles">
@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #0d0814;
  --bg2: #160f24;
  --ivory: #f3ead9;
  --ink: #09050e;
  --gold: #cda13a;
  --turquoise: #22b8ae;
  --violet: #9c6bf0;
  --blue: #4a5fd1;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(243, 234, 217, 0.12);
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ivory);
  font-family: 'Vazirmatn', sans-serif;
  overflow-x: hidden;
  direction: rtl;
}

.msr-glaze {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: 
    radial-gradient(600px 500px at var(--mx, 50%) var(--my, 50%), rgba(156,107,240,0.35), transparent 60%),
    radial-gradient(800px 600px at 15% 15%, rgba(34,184,174,0.28), transparent 55%),
    radial-gradient(700px 700px at 85% 20%, rgba(74,95,209,0.30), transparent 55%),
    radial-gradient(900px 900px at 50% 100%, rgba(205,161,58,0.14), transparent 60%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
}

.msr-blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.15; pointer-events: auto; cursor: grab; }
.msr-blob.b1 { width: 300px; height: 300px; background: var(--turquoise); top: 10%; right: 10%; }
.msr-blob.b2 { width: 400px; height: 400px; background: var(--violet); bottom: 10%; left: 5%; }

.msr-nav {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 5vw; background: rgba(13, 8, 20, 0.75);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
}
.msr-brand { font-family: 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 1.3rem; color: var(--gold); }
.msr-links { display: flex; gap: 12px; align-items: center; }
.msr-link { background: none; border: none; color: var(--ivory); opacity: 0.8; cursor: pointer; padding: 6px 12px; font-family: inherit; font-size: 0.95rem; border-radius: 8px; transition: 0.2s; }
.msr-link.active, .msr-link:hover { opacity: 1; background: var(--glass); color: var(--gold); }
.msr-admin-btn { background: var(--glass); border: 1px solid var(--glass-border); color: var(--ivory); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.msr-admin-btn.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }

.msr-main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 5vw 90px; }
.msr-page { display: none; }
.msr-page.active { display: block; animation: msrFade 0.4s ease; }
@keyframes msrFade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.msr-hero { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: center; padding: 72px 0 56px; }
.msr-hero-medallion {
  position: relative; width: min(360px, 80vw); aspect-ratio: 1; margin: 0 auto;
  border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass);
  display: flex; align-items: center; justify-content: center;
}
.msr-hero-medallion::before {
  content: ''; position: absolute; inset: -14px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--turquoise), var(--violet), var(--blue), var(--gold), var(--turquoise));
  opacity: 0.5; filter: blur(18px); z-index: -1; animation: msrSpin 16s linear infinite;
}
@keyframes msrSpin { to { transform: rotate(360deg); } }

.msr-stats { display: flex; gap: 24px; margin-top: 24px; }
.msr-stat b { display: block; font-family: 'Noto Naskh Arabic', serif; font-size: 1.6rem; color: var(--gold); }
.msr-stat span { font-size: 0.82rem; color: rgba(243,234,217,0.65); }

.msr-medallion { position: relative; border-radius: 50%; overflow: hidden; border: 1px solid var(--glass-border); width: 100%; height: 100%; }
.msr-medallion img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; transform: rotate(var(--rot,0deg)); transform-origin: 50% 50%; cursor: grab; user-select: none; }

.msr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 26px; }
.msr-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.25s; opacity: 1; }
.msr-card:hover { transform: translateY(-6px); border-color: rgba(205,161,58,0.5); }
.msr-card .msr-medallion { width: 140px; height: 140px; margin-bottom: 12px; }

.msr-price { color: var(--gold); font-weight: 700; margin: 8px 0; }
.msr-add-card { background: rgba(255,255,255,0.02); border: 2px dashed var(--glass-border); border-radius: var(--radius); min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: rgba(243,234,217,0.5); gap: 8px; }
.msr-add-card:hover { color: var(--ivory); border-color: var(--gold); }

[contenteditable="true"] { outline: 1px dashed rgba(205,161,58,0.55); border-radius: 6px; padding: 1px 4px; }
[contenteditable="true"]:focus { outline: 1px solid var(--gold); background: rgba(205,161,58,0.08); }

.msr-upload-label { position: absolute; inset: 0; background: rgba(9,5,14,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; cursor: pointer; color: #fff; font-size: 0.85rem; }
.msr-medallion:hover .msr-upload-label { opacity: 1; }
.msr-upload-label input { display: none; }

.msr-about { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 48px; align-items: start; padding: 20px 0; }
.msr-about .msr-medallion { width: 260px; height: 260px; margin: 0 auto; }
.msr-fact-row { display: flex; gap: 20px; margin-top: 16px; }
.msr-fact b { display: block; color: var(--gold); font-family: 'Noto Naskh Arabic', serif; font-size: 1.2rem; }

.msr-contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 10px 0 40px; }
.msr-contact-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 24px; }

.msr-modal-backdrop { position: fixed; inset: 0; background: rgba(9,5,14,0.72); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
.msr-modal-backdrop.show { display: flex; }
.msr-modal { background: var(--bg2); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 340px; }
.msr-btn { background: var(--glass); border: 1px solid var(--glass-border); color: var(--ivory); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; }
.msr-btn.primary { background: var(--gold); color: var(--ink); border: none; font-weight: 600; }

.msr-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--gold); color: var(--ink); padding: 10px 22px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.25s; z-index: 99; }
.msr-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .msr-hero, .msr-about { grid-template-columns: 1fr; text-align: center; }
  .msr-contact-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="msr-root" id="msrRoot">
  <div class="msr-glaze" id="msrGlaze"></div>
  <div class="msr-blob b1" data-blob></div>
  <div class="msr-blob b2" data-blob></div>

  <nav class="msr-nav">
    <div class="msr-brand" id="msrShopName">کارگاه مینا سرا</div>
    <div class="msr-links">
      <button class="msr-link active" data-nav="home">خانه</button>
      <button class="msr-link" data-nav="products">محصولات</button>
      <button class="msr-link" data-nav="about">درباره فروشنده</button>
      <button class="msr-link" data-nav="contact">تماس</button>
      <button class="msr-admin-btn" id="msrAdminBtn" title="ورود مدیر">⚙</button>
    </div>
  </nav>

  <main class="msr-main">
    <!-- HOME -->
    <section class="msr-page active" data-page="home">
      <div class="msr-hero">
        <div>
          <h1 style="font-size:2.2rem; margin-bottom:12px;">هنر دست و میناکاری اصیل</h1>
          <p style="opacity:0.8; line-height:1.7;">تولیدکننده ظروف و آثار هنری فاخر میناکاری با بالاترین کیفیت لعاب و پخت.</p>
          <div class="msr-stats" id="msrStats"></div>
        </div>
        <div class="msr-hero-medallion" id="msrHeroMedallion">
          <div class="msr-medallion">
            <img id="msrHeroImg" src="" alt="Hero">
          </div>
        </div>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section class="msr-page" data-page="products">
      <h2 style="margin: 30px 0 20px;">محصولات ما</h2>
      <div class="msr-grid" id="msrProductGrid"></div>
    </section>

    <!-- ABOUT -->
    <section class="msr-page" data-page="about">
      <div class="msr-about">
        <div class="msr-hero-medallion" id="msrAboutMedallion">
          <div class="msr-medallion">
            <img id="msrAboutImg" src="" alt="Seller">
          </div>
        </div>
        <div>
          <h2 id="msrSellerName" contenteditable="false" data-field="seller.name"></h2>
          <p id="msrSellerTitle" style="color:var(--gold); margin-bottom:16px;" contenteditable="false" data-field="seller.title"></p>
          <p id="msrBio" style="line-height:1.8; opacity:0.85;" contenteditable="false" data-field="seller.bio"></p>
          <div class="msr-fact-row" id="msrFactRow"></div>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="msr-page" data-page="contact">
      <h2 style="margin: 30px 0 20px;">راه ارتباطی</h2>
      <div class="msr-contact-grid">
        <div class="msr-contact-card">
          <h3>اطلاعات تماس</h3>
          <p style="margin-top:10px;">تلفن: <a id="msrPhoneLink" contenteditable="false" data-field="seller.phone"></a></p>
          <p>ایمیل: <a id="msrEmailLink" contenteditable="false" data-field="seller.email"></a></p>
          <p>اینستاگرام: <span id="msrInsta" contenteditable="false" data-field="seller.instagram"></span></p>
        </div>
        <div class="msr-contact-card">
          <h3>نشانی و ساعت کاری</h3>
          <p style="margin-top:10px;">آدرس: <span id="msrAddress" contenteditable="false" data-field="seller.address"></span></p>
          <p>ساعات کاری: <span id="msrHours" contenteditable="false" data-field="seller.hours"></span></p>
        </div>
      </div>
    </section>
  </main>

  <div class="msr-toast" id="msrToast"></div>

  <!-- ADMIN LOGIN MODAL -->
  <div class="msr-modal-backdrop" id="msrModalBackdrop">
    <div class="msr-modal">
      <h3 style="margin-bottom:12px; text-align:center;">ورود مدیریت</h3>
      <input type="password" id="msrPinInput" placeholder="رمز عبور (1234)" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--glass); color:#fff; margin-bottom:12px;">
      <div style="display:flex; gap:10px;">
        <button class="msr-btn primary" id="msrLoginBtn" style="flex:1;">ورود</button>
        <button class="msr-btn" id="msrCloseModalBtn" style="flex:1;">انصراف</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzYxh5QPlViwv4M0fSJGf2uALdtBXm5CU",
    authDomain: "minakari-4392b.firebaseapp.com",
    databaseURL: "https://minakari-4392b-default-rtdb.firebaseio.com",
    projectId: "minakari-4392b",
    storageBucket: "minakari-4392b.firebasestorage.app",
    messagingSenderId: "833708259975",
    appId: "1:833708259975:web:526f040d4086aa6f785622",
    measurementId: "G-W1LZTTCFTS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const ADMIN_PIN = "1234";
  let isAdmin = false;
  let data = null;
  const root = document.getElementById('msrRoot');

  function defaultData() {
    return {
      seller: {
        shopName: "کارگاه مینا سرا",
        name: "استاد میناکار",
        title: "هنرمند و مدرس میناکاری",
        bio: "ارائه‌دهنده نفیس‌ترین ظروف و آثارهنری میناکاری با سابقه درخشان در اصفهان.",
        years: "12",
        pieces: "+1500",
        students: "+300",
        phone: "09123456789",
        email: "info@example.com",
        instagram: "@minasara",
        address: "اصفهان، میدان نقش جهان",
        hours: "۹ صبح الی ۹ شب",
        avatar: "",
        heroImage: ""
      },
      products: [
        { id: "p1", name: "بشقاب میناکاری ۳۰ سانتی", price: "۱,۵۰۰,۰۰۰ تومان", size: "۳۰cm", desc: "لعاب برجسته درجه یک", tag: "پرفروش", image: "" }
      ]
    };
  }

  function makePlaceholder(hueA, hueB) {
    const c = document.createElement('canvas');
    c.width = 300; c.height = 300;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,300,300);
    g.addColorStop(0, `hsl(${hueA} 70% 50%)`);
    g.addColorStop(1, `hsl(${hueB} 70% 30%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,300,300);
    return c.toDataURL();
  }

  function ensureImages(d) {
    if(!d.seller) d.seller = {};
    if(!d.products) d.products = [];
    if(!d.seller.avatar) d.seller.avatar = makePlaceholder(280,200);
    if(!d.seller.heroImage) d.seller.heroImage = makePlaceholder(190,320);
    d.products.forEach((p,i) => { if(!p.image) p.image = makePlaceholder(200,300); });
    return d;
  }

  function setPath(obj, path, val) {
    const parts = path.split('.');
    let o = obj;
    for(let i=0; i<parts.length-1; i++) o = o[parts[i]];
    o[parts[parts.length-1]] = val;
  }

  let saveTimer = null;
  function saveToFirebase() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      set(ref(db, 'storeData'), data)
        .then(() => toast('ذخیره شد در دیتابیس'))
        .catch(err => toast('خطا در ذخیره: ' + err.message));
    }, 400);
  }

  function listenToFirebase() {
    const dataRef = ref(db, 'storeData');
    onValue(dataRef, (snapshot) => {
      const val = snapshot.val();
      if(val) {
        data = ensureImages(val);
      } else {
        data = ensureImages(defaultData());
        saveToFirebase();
      }
      renderAll();
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('msrToast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  function renderAll() {
    if(!data) return;
    document.getElementById('msrShopName').textContent = data.seller.shopName || '';
    document.getElementById('msrHeroImg').src = data.seller.heroImage || '';
    document.getElementById('msrStats').innerHTML = statTemplate();
    renderProducts();
    renderAbout();
    renderContact();
    injectSellerUploadLabels();
    applyAdminState();
  }

  function statTemplate() {
    return `
      <div class="msr-stat"><b data-field="seller.years">${data.seller.years||''}</b><span>سال تجربه</span></div>
      <div class="msr-stat"><b data-field="seller.pieces">${data.seller.pieces||''}</b><span>قطعه ساخته‌شده</span></div>
      <div class="msr-stat"><b data-field="seller.students">${data.seller.students||''}</b><span>هنرجوی آموزش‌دیده</span></div>
    `;
  }

  function renderProducts() {
    const grid = document.getElementById('msrProductGrid');
    grid.innerHTML = '';
    (data.products || []).forEach(p => {
      const card = document.createElement('div');
      card.className = 'msr-card';
      card.innerHTML = `
        <div class="msr-medallion">
          <img src="${p.image}">
          <label class="msr-upload-label" style="display:${isAdmin?'flex':'none'}">
            تغییر عکس
            <input type="file" accept="image/*" data-upload-product="${p.id}">
          </label>
        </div>
        <span style="font-size:0.75rem; color:var(--turquoise);">${p.tag||''}</span>
        <h3 data-field="product.${p.id}.name">${p.name||''}</h3>
        <div class="msr-price" data-field="product.${p.id}.price">${p.price||''}</div>
        <div style="font-size:0.85rem; opacity:0.8;" data-field="product.${p.id}.desc">${p.desc||''}</div>
        ${isAdmin ? `<button class="msr-btn" data-remove-product="${p.id}" style="margin-top:10px; color:#e08297;">حذف</button>` : ''}
      `;
      grid.appendChild(card);
    });

    if(isAdmin) {
      const addCard = document.createElement('div');
      addCard.className = 'msr-add-card';
      addCard.innerHTML = `<span>+</span><div>افزودن محصول جدید</div>`;
      addCard.onclick = addProduct;
      grid.appendChild(addCard);
    }
  }

  function renderAbout() {
    document.getElementById('msrAboutImg').src = data.seller.avatar || '';
    document.getElementById('msrSellerName').textContent = data.seller.name || '';
    document.getElementById('msrSellerTitle').textContent = data.seller.title || '';
    document.getElementById('msrBio').textContent = data.seller.bio || '';
    document.getElementById('msrFactRow').innerHTML = statTemplate();
  }

  function renderContact() {
    const phone = document.getElementById('msrPhoneLink');
    phone.textContent = data.seller.phone || '';
    phone.href = 'tel:' + (data.seller.phone ? data.seller.phone.replace(/[^\d+]/g,'') : '');
    const email = document.getElementById('msrEmailLink');
    email.textContent = data.seller.email || '';
    email.href = 'mailto:' + (data.seller.email || '');
    document.getElementById('msrInsta').textContent = data.seller.instagram || '';
    document.getElementById('msrAddress').textContent = data.seller.address || '';
    document.getElementById('msrHours').textContent = data.seller.hours || '';
  }

  function applyAdminState() {
    document.getElementById('msrAdminBtn').classList.toggle('on', isAdmin);
    document.querySelectorAll('[data-field]').forEach(el => {
      el.setAttribute('contenteditable', isAdmin ? 'true' : 'false');
    });
  }

  function bindEditableCommit() {
    root.addEventListener('focusout', (e) => {
      const el = e.target.closest('[data-field]');
      if(!el || !isAdmin) return;
      const field = el.dataset.field;
      let val = el.textContent.trim();
      
      if(field.startsWith('product.')) {
        const [, id, key] = field.split('.');
        const prod = data.products.find(p => p.id === id);
        if(prod) prod[key] = val;
      } else {
        setPath(data, field, val);
      }
      saveToFirebase();
    }, true);
  }

  function resizeImage(file, maxDim, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim) {
          if(w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg', 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function bindUploads() {
    root.addEventListener('change', (e) => {
      const input = e.target.closest('input[type="file"]');
      if(!input || !isAdmin) return;
      const file = input.files[0];
      if(!file) return;
      toast('در حال پردازش...');
      resizeImage(file, 500, (dataUrl) => {
        if(input.dataset.uploadProduct) {
          const prod = data.products.find(p => p.id === input.dataset.uploadProduct);
          if(prod) prod.image = dataUrl;
        } else if(input.id === 'msrAvatarInput') {
          data.seller.avatar = dataUrl;
        } else if(input.id === 'msrHeroInput') {
          data.seller.heroImage = dataUrl;
        }
        renderAll();
        saveToFirebase();
      });
    });
  }

  function addProduct() {
    data.products.push({
      id: 'p_' + Date.now(),
      name: 'محصول جدید',
      price: '۰ تومان',
      desc: 'توضیحات محصول',
      tag: 'جدید',
      image: makePlaceholder(100, 200)
    });
    renderProducts();
    applyAdminState();
    saveToFirebase();
  }

  function bindRemoveProduct() {
    root.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove-product]');
      if(!btn || !isAdmin) return;
      const id = btn.dataset.removeProduct;
      data.products = data.products.filter(p => p.id !== id);
      renderProducts();
      applyAdminState();
      saveToFirebase();
    });
  }

  function injectSellerUploadLabels() {
    const aboutM = document.querySelector('#msrAboutMedallion .msr-medallion');
    if(aboutM && !aboutM.querySelector('.msr-upload-label')) {
      aboutM.insertAdjacentHTML('beforeend', `<label class="msr-upload-label" style="display:${isAdmin?'flex':'none'}">تغییر عکس<input type="file" accept="image/*" id="msrAvatarInput"></label>`);
    }
    const heroM = document.querySelector('#msrHeroMedallion .msr-medallion');
    if(heroM && !heroM.querySelector('.msr-upload-label')) {
      heroM.insertAdjacentHTML('beforeend', `<label class="msr-upload-label" style="display:${isAdmin?'flex':'none'}">تغییر عکس<input type="file" accept="image/*" id="msrHeroInput"></label>`);
    }
  }

  function bindNav() {
    document.querySelectorAll('.msr-link').forEach(link => {
      link.addEventListener('click', () => {
        const page = link.dataset.nav;
        document.querySelectorAll('.msr-page').forEach(p => p.classList.toggle('active', p.dataset.page === page));
        document.querySelectorAll('.msr-link').forEach(l => l.classList.toggle('active', l === link));
      });
    });
  }

  function bindAdminLogin() {
    const backdrop = document.getElementById('msrModalBackdrop');
    const pinInput = document.getElementById('msrPinInput');
    
    document.getElementById('msrAdminBtn').addEventListener('click', () => {
      if(isAdmin) {
        isAdmin = false;
        applyAdminState();
        renderProducts();
        toast('از حالت مدیریت خارج شدید');
      } else {
        backdrop.classList.add('show');
        pinInput.value = '';
        pinInput.focus();
      }
    });

    document.getElementById('msrCloseModalBtn').addEventListener('click', () => backdrop.classList.remove('show'));
    document.getElementById('msrLoginBtn').addEventListener('click', () => {
      if(pinInput.value === ADMIN_PIN) {
        isAdmin = true;
        applyAdminState();
        renderProducts();
        backdrop.classList.remove('show');
        toast('با موفقیت وارد شدید');
      } else {
        toast('رمز عبور اشتباه است');
      }
    });
  }

  function bindGlazeMouse() {
    window.addEventListener('pointermove', (e) => {
      const mx = (e.clientX / window.innerWidth * 100).toFixed(1) + '%';
      const my = (e.clientY / window.innerHeight * 100).toFixed(1) + '%';
      document.documentElement.style.setProperty('--mx', mx);
      document.documentElement.style.setProperty('--my', my);
    });
  }

  function init() {
    listenToFirebase();
    bindNav();
    bindEditableCommit();
    bindUploads();
    bindRemoveProduct();
    bindAdminLogin();
    bindGlazeMouse();
  }

  init();
</script>
</body>
</html>
